name: CI

# Plan T-002. Two things here are non-negotiable and were deliberately placed in
# the very first commit rather than "added later":
#
#   1. The pipeline fails the build on any test failure. A determinism bug that
#      is caught on day 5 costs minutes; the same bug caught after the netcode
#      lands costs a weekend.
#   2. `test-arm` runs the full suite on aarch64. Risk R-07 is "the simulation
#      is bit-identical on x86_64 and wasm32 but not on aarch64", which would
#      only ever show up on a player's phone. A second architecture in CI is the
#      cheapest possible guard, and it is worthless if it is added after the
#      first divergence.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep the benchmark honest but tolerant of a noisy shared runner.
  WORLD_BENCH_SLACK: "3"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The fuzz harness is a separate crate (nightly + libFuzzer), so it is not
      # in the workspace and nothing else would notice it rotting. Building it on
      # stable is enough to catch the common breakage — a renamed message type or
      # a changed `decode_checked` signature — without needing nightly in CI.
      - name: build the fuzz harness
        run: cargo build --manifest-path fuzz/Cargo.toml

  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          # R-07: the ARM determinism guard. Same suite, different ISA.
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.arch }}
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo build (wasm32)
        # The client's prediction crate must compile to wasm; if this breaks,
        # the whole "one implementation of the rules" premise (A-07) breaks.
        run: cargo build --target wasm32-unknown-unknown -p sim

  wasm-golden:
    name: wasm determinism (T-015, T-025)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-golden
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The golden fixtures are generated natively and compared *again* here
      # with the same code compiled to wasm. This is the AC's "native and wasm
      # produce identical hash sequences", and it needs no wasm runtime beyond
      # Node, which the runner already has.
      - name: build the golden test for wasm
        run: cargo test --release --target wasm32-wasip1 -p sim --test golden --no-run
      - name: run it under node's WASI
        run: |
          set -euo pipefail
          wasm=$(ls target/wasm32-wasip1/release/deps/golden-*.wasm | head -n1)
          echo "running $wasm"
          node tools/wasm-golden.mjs "$wasm"
      # T-025's site-selection portability criterion. The client draws the
      # airdrop telegraph from the same seed the server picks from, so the two
      # targets must choose the same site from the same RNG draw. The test pins
      # the sequence to one committed vector; this step proves the wasm side of
      # it rather than asserting it in a comment.
      - name: build the sim unit tests for wasm
        run: cargo test --release --target wasm32-wasip1 -p sim --lib --no-run
      - name: run the airdrop portability test under node's WASI
        run: |
          set -euo pipefail
          wasm=$(ls target/wasm32-wasip1/release/deps/sim-*.wasm | head -n1)
          echo "running $wasm"
          node tools/wasm-golden.mjs "$wasm" airdrop::tests::site_selection_is_portable

  bench:
    name: budget (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-${{ matrix.arch }}
      - name: worldgen and mesh budgets (T-006, T-007)
        run: cargo bench -p world --bench gen

  web:
    name: web (pnpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 22
          cache: pnpm
      # `apps/web` does not exist yet (M0 is Rust-only), so these steps no-op
      # until the client lands in M3. They are wired up now so that the first
      # client PR does not also have to debug CI plumbing.
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r build
